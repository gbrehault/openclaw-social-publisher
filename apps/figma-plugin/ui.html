<!doctype html><html><style>body{font:13px Inter,system-ui;margin:0;padding:18px;background:#11131a;color:#fff}h2{margin:0 0 16px}label{color:#9ba1b3;display:block;margin:14px 0 6px}input{width:100%;box-sizing:border-box;background:#1b1e29;color:#fff;border:1px solid #303545;border-radius:7px;padding:9px}button{width:100%;padding:10px;border:0;border-radius:7px;background:#9b7bff;color:white;font-weight:700;margin-top:18px}.secondary{background:#303545}.muted{color:#9ba1b3;line-height:1.5}.status{margin-top:16px;padding:10px;border-radius:7px;background:#1b1e29;white-space:pre-wrap}.ok{color:#76e0a2}.error{color:#ff8b8b}</style><h2>OpenClaw Publisher — Live Figma Test</h2><p class="muted">This test loads one queued campaign from the localhost bridge, creates real Figma frames, exports JPGs, and sends them back to the bridge. No platform credentials are used.</p><label>Bridge URL</label><input id="bridge" value="http://127.0.0.1:4318"><button id="load">Load next bridge job</button><button id="manual" class="secondary">Create local 7-slide test</button><div class="status" id="status">Waiting for a bridge job.</div><script>const $=id=>document.getElementById(id);let job=null;const say=(s,c='')=>{$('status').className='status '+c;$('status').textContent=s};async function create(j){job=j;say('Creating '+j.slides.length+' real frames…');parent.postMessage({pluginMessage:{type:'create',slides:j.slides}},'*')}$('load').onclick=async()=>{try{const r=await fetch($('bridge').value+'/job');if(r.status===204)return say('No queued bridge job. Run the prepare command first.','error');if(!r.ok)throw Error(await r.text());await create(await r.json())}catch(e){say('Bridge error: '+e.message,'error')}};$('manual').onclick=()=>create({jobId:null,name:'manual-7-slides',slides:Array.from({length:7},(_,i)=>({title:i===0?'Live test cover':i===6?'Live test CTA':'Live test point '+i,body:'OpenClaw Social Publisher'}))});onmessage=async e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='export'){try{if(!job?.jobId)return say('Frames created locally; no bridge job to receive exports.','error');const r=await fetch($('bridge').value+'/export',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jobId:job.jobId,name:m.name,dataBase64:m.dataBase64})});if(!r.ok)throw Error(await r.text());say('Uploaded '+m.name+' to bridge…')}catch(err){say('Export upload error: '+err.message,'error')}}if(m.type==='done')say('Completed: '+m.count+' real Figma frames and JPG export upload. Check /status?jobId='+job.jobId,'ok');if(m.type==='error')say('Figma error: '+m.message,'error')};</script></html>
