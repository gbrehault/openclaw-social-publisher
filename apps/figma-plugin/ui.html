<!doctype html><html><style>body{font:13px Inter,system-ui;margin:0;padding:18px;background:#11131a;color:#fff}h2{margin:0 0 16px}label{color:#9ba1b3;display:block;margin:14px 0 6px}input{width:100%;box-sizing:border-box;background:#1b1e29;color:#fff;border:1px solid #303545;border-radius:7px;padding:9px}button{width:100%;padding:10px;border:0;border-radius:7px;background:#9b7bff;color:white;font-weight:700;margin-top:18px}.muted{color:#9ba1b3;line-height:1.5}.status{margin-top:16px;padding:10px;border-radius:7px;background:#1b1e29}</style><h2>OpenClaw Publisher</h2><p class="muted">Create a dynamic slide deck from the current campaign. The plugin never receives platform credentials.</p><label>Slides</label><input id="count" type="number" min="3" max="50" value="7"><label>Brand label</label><input id="brand" value="BRHCRÉA"><button id="create">Create frames</button><div class="status" id="status">Disconnected from campaign</div><script>create.onclick=()=>{const n=Number(count.value);const slides=Array.from({length:n},(_,i)=>({title:i===0?'Campaign title':i===n-1?'Call to action':'Content point'}));parent.postMessage({pluginMessage:{type:'create',slides}},'*')};onmessage=e=>{if(e.data.pluginMessage?.type==='done')status.textContent='Created '+e.data.pluginMessage.count+' frames';}</script></html>
